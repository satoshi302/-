<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引越し渋滞情報 比較ツール</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header>
  <h1>引越し渋滞情報 比較ツール</h1>
  <p class="sub">登録済みの地点について、過去の渋滞状況とこれからの状況を比較できます。</p>
</header>

<main>
  <section class="card">
    <h2>地点を選んで比較する</h2>
    <div class="form-row">
      <select id="compare-point-select"></select>
    </div>
    <div class="form-row two-col">
      <fieldset>
        <legend>これから(現在)の期間</legend>
        <input type="date" id="current-start">
        <span>〜</span>
        <input type="date" id="current-end">
      </fieldset>
      <fieldset>
        <legend>過去の期間</legend>
        <input type="date" id="past-start">
        <span>〜</span>
        <input type="date" id="past-end">
      </fieldset>
    </div>
    <button id="compare-btn">比較する</button>
    <p id="compare-status" class="status"></p>

    <div class="chart-box">
      <h3>時間帯別 平均交通量</h3>
      <canvas id="hourly-chart"></canvas>
    </div>
    <div class="chart-box">
      <h3>日別 平均交通量</h3>
      <canvas id="daily-chart"></canvas>
    </div>
  </section>

  <section class="card">
    <h2>このダッシュボードについて</h2>
    <p class="hint">
      地点の登録や過去データ(<a href="https://www.compusophia.com/en/notes/1" target="_blank" rel="noopener">Compusophia</a>アーカイブ)の取込は管理者が行っています。
      新しい地点の追加や過去データの取込をご希望の場合は管理者にご連絡ください。<br>
      交通量データは <a href="https://www.jartic-open-traffic.org/" target="_blank" rel="noopener">JARTIC 交通量オープンデータ</a> を毎日自動取得して蓄積しています。
    </p>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
